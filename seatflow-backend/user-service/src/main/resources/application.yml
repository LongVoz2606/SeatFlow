spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seatflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history_user

server:
  port: ${SERVER_PORT:8082}

seatflow:
  jwt:
    secret: ${JWT_SECRET:seatflow-super-secret-key-for-jwt-signing-must-be-at-least-256-bits}
    access-token-expiry-ms: ${JWT_EXPIRY_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
