spring:
  datasource:
    url: jdbc:h2:mem:auth_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_auth
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8081

seatflow:
  jwt:
    secret: seatflow-super-secret-key-for-jwt-signing-must-be-at-least-256-bits
    access-token-expiry-ms: 86400000
    access-token-expiry-seconds: 86400
