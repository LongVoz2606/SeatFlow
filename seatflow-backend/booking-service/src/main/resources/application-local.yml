spring:
  datasource:
    url: jdbc:h2:mem:booking_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_booking
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8084

seatflow:
  jwt:
    secret: seatflow-super-secret-key-for-jwt-signing-must-be-at-least-256-bits
    access-token-expiry-ms: 86400000
  booking:
    hold-duration-minutes: 15
  event-service:
    url: http://localhost:8083
  redisson:
    address: redis://localhost:6379
