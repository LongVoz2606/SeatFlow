spring:
  datasource:
    url: jdbc:h2:mem:payment_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_payment
  kafka:
    listener:
      auto-startup: false

server:
  port: 8085

seatflow:
  jwt:
    secret: seatflow-super-secret-key-for-jwt-signing-must-be-at-least-256-bits
    access-token-expiry-ms: 86400000

# Booking service URL for local development REST calls
seatflow.booking-service.url: http://localhost:8084
