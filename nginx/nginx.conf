user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # ─── Anti slow-loris / oversized body ─────────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ─── Rate Limiting ────────────────────────────────────────────────────────
    # HTTP 429 thay vì 503 mặc định khi bị chặn, đúng ngữ nghĩa "Too Many Requests"
    limit_req_status 429;
    limit_conn_status 429;

    # Baseline: mọi endpoint /api/* chưa có zone riêng đều được giới hạn qua zone này
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    # Booking hold/confirm: max 5 req/s per IP (chống spam đặt ghế / xác nhận đồng thời)
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/s;
    # Auth (login/register/oauth) + đăng ký nhà tổ chức: max 3 req/s per IP (chống brute force / spam đăng ký)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;
    # Payment: max 5 req/s per IP
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/s;

    # Giới hạn số kết nối đồng thời mỗi IP (chống connection-flood)
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── Upstream Services ────────────────────────────────────────────────────
    upstream auth_service    { server auth-service:8081; }
    upstream user_service    { server user-service:8082; }
    upstream event_service   { server event-service:8083; }
    upstream booking_service { server booking-service:8084; }
    upstream payment_service { server payment-service:8085; }
    upstream frontend_app    { server frontend:80; }

    server {
        listen 80;
        server_name localhost;

        limit_conn conn_limit 20;

        # ─── Frontend SPA ─────────────────────────────────────────────────────
        location / {
            proxy_pass http://frontend_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Auth Service ─────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service/api/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ─── User Service ─────────────────────────────────────────────────────
        location /api/users/ {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://user_service/api/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ─── Event Service ────────────────────────────────────────────────────
        location = /api/events {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://event_service/api/events;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/events/ {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://event_service/api/events/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ─── Organizer (Nhà tổ chức) ──────────────────────────────────────────
        location = /api/organizers {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://event_service/api/organizers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/organizers/ {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://event_service/api/organizers/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            # Đăng ký/gửi lại hồ sơ nhà tổ chức: giới hạn chặt hơn (chống spam đăng ký)
            location ~ ^/api/organizers/(register|resubmit)$ {
                limit_req zone=auth_limit burst=10 nodelay;
                proxy_pass http://event_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Authorization $http_authorization;
            }
        }

        # ─── Booking Service ──────────────────────────────────────────────────
        location /api/bookings/ {
            limit_req zone=general_limit burst=40 nodelay;
            proxy_pass http://booking_service/api/bookings/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;

            # Giữ ghế: giới hạn chặt (chống spam giữ hết ghế / bot săn vé)
            location /api/bookings/hold {
                limit_req zone=booking_limit burst=10 nodelay;
                proxy_pass http://booking_service/api/bookings/hold;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Authorization $http_authorization;
            }

            # Xác nhận booking: cũng chạm tới event-service + Kafka outbox, giới hạn tương tự hold
            location /api/bookings/confirm {
                limit_req zone=booking_limit burst=10 nodelay;
                proxy_pass http://booking_service/api/bookings/confirm;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Authorization $http_authorization;
            }
        }

        # ─── Payment Service ──────────────────────────────────────────────────
        location /api/payments/ {
            limit_req zone=payment_limit burst=10 nodelay;
            proxy_pass http://payment_service/api/payments/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
        }

        # ─── Swagger UIs (per service) ────────────────────────────────────────
        location /docs/auth/ {
            proxy_pass http://auth_service/swagger-ui/;
        }
        location /docs/events/ {
            proxy_pass http://event_service/swagger-ui/;
        }
        location /docs/bookings/ {
            proxy_pass http://booking_service/swagger-ui/;
        }

        # ─── Health Checks ────────────────────────────────────────────────────
        location /health/auth     { proxy_pass http://auth_service/actuator/health; }
        location /health/events   { proxy_pass http://event_service/actuator/health; }
        location /health/bookings { proxy_pass http://booking_service/actuator/health; }
        location /health/payments { proxy_pass http://payment_service/actuator/health; }
    }
}
