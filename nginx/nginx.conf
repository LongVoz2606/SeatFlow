user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Rate Limiting Zone for Booking API (chống spam đặt ghế)
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # Frontend SPA
        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend REST API
        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Apply rate limiting specifically to hold seat endpoint
            location /api/bookings/hold {
                limit_req zone=booking_limit burst=10 nodelay;
                proxy_pass http://backend:8080/api/bookings/hold;
            }
        }

        # Swagger UI & API Docs
        location /swagger-ui/ {
            proxy_pass http://backend:8080/swagger-ui/;
        }
        location /v3/api-docs {
            proxy_pass http://backend:8080/v3/api-docs;
        }
    }
}
