name: SeatFlow CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Build & Test Backend (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seatflow_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ./seatflow-backend/pom.xml

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x seatflow-backend/mvnw

      - name: Build & Run Tests
        working-directory: ./seatflow-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/seatflow_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_REDIS_HOST: localhost
          SPRING_REDIS_PORT: 6379
        run: ./mvnw clean test -B

  frontend-build-lint:
    name: Build & Verify Frontend (React + Vite + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./seatflow-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./seatflow-frontend
        run: npm ci

      - name: Build Production Distribution
        working-directory: ./seatflow-frontend
        run: npm run build
